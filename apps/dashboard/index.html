<!doctype html>
<html lang="en" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <!--
      The title and `lang` are what the Next app rendered per request out of the
      message catalogue. A static shell has no request, so English is the
      starting value and `<DocumentLanguage>` replaces both once the reader's
      locale is known. Anything a crawler would read is behind a login anyway.
    -->
    <title>Rustrak - Error Tracking System</title>
    <meta
      name="description"
      content="Lightweight, self-hosted error tracking compatible with Sentry SDKs"
    />
    <!--
      `color-scheme: light` on <html> above is the same default `ThemeProvider`
      carries (`defaultTheme="light"`, ADR-0022). Spelled out here as well so the
      first paint is already light: next-themes injects a blocking script that
      adds `dark` for a reader who chose it, and a static shell has to state the
      default instead of flashing until React mounts.
    -->
  </head>
  <body class="antialiased min-h-screen flex flex-col">
    <div id="root" class="min-h-screen flex flex-col flex-1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
