# Brand overlay check (BugLenz fork; ADR-0006, ADR-0005, OpenSpec 007).
#
# The brand is applied at build time to a copy of the tree, never committed.
# This job does what the release build does, on every PR and every sync:
# applies the rules (each states how many matches it expects, so a merge from
# the upstream that adds or removes a branded string fails here, naming the
# rule), verifies that zone C is untouched and the attribution is present, then
# proves the branded tree still compiles: dashboard type-check and build,
# server cargo check.
name: Brand

on:
  # ADR-0019: not for governance, deploy notes or changesets only.
  pull_request:
    paths-ignore: ["governance/**", "deploy/**", ".changeset/**"]
  push:
    branches: [main, next, "sync/**"]
    paths-ignore: ["governance/**", "deploy/**", ".changeset/**"]
  workflow_dispatch:

concurrency:
  group: brand-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BRANDED: ${{ github.workspace }}/../branded

jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Engine and guard tests
        run: node --test "brand/test/*.test.mjs"

      - name: Apply the rules to a copy of the tree
        run: node brand/apply.mjs buglenz --dest "$BRANDED" --var release=v0.0.0-check

      - name: Verify zone C, catalogs and attribution
        run: node brand/verify.mjs buglenz --branded "$BRANDED"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Build the branded dashboard
        working-directory: ${{ env.BRANDED }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@rustrak/dashboard
          (cd apps/dashboard && pnpm exec tsc --noEmit)

      - name: No Rustrak left in the built bundle except the attribution
        working-directory: ${{ env.BRANDED }}
        run: |
          # Strings the SDK, the API and the protocol own (URLs, headers, storage
          # keys, package scopes, the attribution) are lowercase or prefixed; a
          # capitalised product name in the bundle is a leak.
          hits=$(grep -rhoE '.{40}Rustrak[^A-Za-z].{40}' apps/dashboard/dist | grep -v 'fork of Rustrak\|bifurcación de Rustrak\|fork de Rustrak\|fork al Rustrak\|Rustrak (github' || true)
          if [ -n "$hits" ]; then echo "$hits" | head -20; echo "::error::the built dashboard still says Rustrak"; exit 1; fi

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}
          cache-workspaces: ${{ env.BRANDED }}/apps/server
      - name: Check the branded server
        working-directory: ${{ env.BRANDED }}/apps/server
        run: cargo check --features openapi --locked
