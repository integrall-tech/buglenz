# Release image (BugLenz fork; ADR-0012, ADR-0005, CONSTITUTION I7 and I11).
#
# Builds the PostgreSQL server image with the dashboard embedded and publishes
# it, privately, to the organisation's GHCR as
# ghcr.io/integrall-tech/buglenz-server:<tag>, where <tag> is the fork's
# vX.Y.Z-itl.N git tag. On a pull request that touches the image inputs the
# same build runs without pushing, as a check. Adapted from the upstream's
# docker-publish.yml, which package 001 removed (Docker Hub, three images, two
# platforms); this one is one image, linux/amd64 only, no telemetry secret,
# built from the branded copy of the tree (brand/, OpenSpec 007).
name: Release image

on:
  push:
    tags: ["v*-itl.*"]
  pull_request:
    paths:
      - apps/server/Dockerfile
      - brand/**
      - apps/server/Cargo.toml
      - apps/server/Cargo.lock
      - rust-toolchain.toml
      - scripts/bundle-dashboard.sh
      - .github/workflows/release-image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Fork tag to build and publish, e.g. v0.16.0-itl.2"
        required: true
        type: string
      platforms:
        description: "Platforms (comma-separated)"
        default: "linux/amd64"
        required: false
        type: string

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/integrall-tech/buglenz-server

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Name the image
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The commit that is actually built: `github.sha` is the dispatching ref's head, not the tag's.
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "version=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-itl\.[0-9]+$' \
              || { echo "::error::'$TAG' is not a fork tag (vX.Y.Z-itl.N)"; exit 1; }
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:$TAG,$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # The brand is applied to a copy, never to the checkout (ADR-0006): the
      # rules state how many matches they expect, so an upstream change that
      # adds or removes a branded string stops the release here.
      - name: Apply and verify the BugLenz brand
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node brand/apply.mjs buglenz --dest "$RUNNER_TEMP/branded" --var release="$VERSION"
          node brand/verify.mjs buglenz --branded "$RUNNER_TEMP/branded"

      - name: Build the branded dashboard into the server's build context
        working-directory: ${{ runner.temp }}/branded
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@rustrak/dashboard
          bash scripts/bundle-dashboard.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The shipped artefact is scanned before anything is pushed (CONSTITUTION I3, spec 002 and 003):
      # the server binary and the dashboard inside the image must carry no token of the egress
      # denylist. Single-platform only (`load` cannot take a manifest list); the build is reused
      # by the next step from the same builder's cache.
      - name: Build the image for inspection
        if: ${{ (inputs.platforms || 'linux/amd64') == 'linux/amd64' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/branded/apps/server
          file: ${{ runner.temp }}/branded/apps/server/Dockerfile
          platforms: linux/amd64
          build-args: FEATURES=postgres
          load: true
          push: false
          tags: buglenz-inspect:local

      - name: Scan the shipped binary and dashboard
        if: ${{ (inputs.platforms || 'linux/amd64') == 'linux/amd64' }}
        run: |
          id=$(docker create buglenz-inspect:local)
          docker cp "$id:/app/rustrak" "$RUNNER_TEMP/rustrak"
          docker cp "$id:/app/static" "$RUNNER_TEMP/static"
          docker rm "$id" >/dev/null
          scripts/network-conformance.sh static "$RUNNER_TEMP/rustrak" "$RUNNER_TEMP/static"

      - name: Build (and push, on a tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/branded/apps/server
          file: ${{ runner.temp }}/branded/apps/server/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          build-args: FEATURES=postgres
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=BugLenz
            org.opencontainers.image.description=BugLenz error tracking server, a GPL-3.0 fork of Rustrak (github.com/rustrak/rustrak)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.vendor=IntegrAllTech

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ steps.meta.outputs.push }}
        run: |
          {
            echo "### Release image"
            echo
            echo "- tags: \`$TAGS\`"
            echo "- pushed: $PUSHED"
            if [ -n "$DIGEST" ]; then echo "- digest: \`$DIGEST\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  prune:
    # The private package counts against the plan's storage quota. The registry counts versions, not
    # releases: each release is three of them (the tagged index and two untagged manifests), so 30
    # keeps about ten releases to roll back to. Counting 10 kept only the last three.
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: buglenz-server
          package-type: container
          min-versions-to-keep: 30
